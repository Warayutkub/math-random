# Render Blueprint — Render builds the Dockerfile and deploys when main changes.
# Flow: PR → CI green → merge to main → Render deploys main.
services:
  - type: web
    name: math-random
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    # Deploy as soon as a PR is merged into main. CI already passed on the PR,
    # and branch protection keeps direct pushes out of main.
    autoDeployTrigger: commit
    healthCheckPath: /
