name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  docker:
    name: Docker build & smoke test
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t math-random:${{ github.sha }} .
      - name: Start container and check the page responds
        run: |
          docker run -d --name app -p 3000:3000 math-random:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/ | grep -q "เป้าหมาย"; then echo "App is up"; exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
